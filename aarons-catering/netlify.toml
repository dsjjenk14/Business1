# Netlify settings. In Netlify, set the base directory to `aarons-catering`.
[build]
  publish = "site"
  command = "node build.mjs"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Server code: the Thanksgiving card checkout (netlify/functions/checkout.mjs).
# Set STRIPE_SECRET_KEY under Site configuration > Environment variables.
[functions]
  directory = "netlify/functions"
