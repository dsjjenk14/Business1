# Makes a member an admin of the live app. Run it from GitHub:
# Actions → "Make admin" → Run workflow → enter the email you signed up with.
name: Make admin

on:
  workflow_dispatch:
    inputs:
      email:
        description: Email of the member (they must have signed up already)
        required: true
      remove:
        description: Remove admin instead
        type: boolean
        default: false

jobs:
  make-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/make-admin.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'yscrfhaedexogvegbvzm' }}
          EMAIL: ${{ inputs.email }}
          REMOVE: ${{ inputs.remove && 'yes' || 'no' }}
