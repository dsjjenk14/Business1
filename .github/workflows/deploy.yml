# Deploys I'm In whenever main changes (or when run by hand from the Actions tab).
#
#  1. Supabase: applies new database migrations and deploys Edge Functions.
#  2. App: publishes an over-the-air update you open on your phone in Expo Go,
#     and the web version testers can open in any browser (imin-dc.expo.app).
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   Supabase → Account → Access Tokens
#   SUPABASE_PROJECT_ID     Supabase project → Settings → General → Project ID
#   SUPABASE_DB_PASSWORD    The database password chosen when the project was created
#   SUPABASE_URL            Supabase project → Settings → API → Project URL
#   SUPABASE_ANON_KEY       Supabase project → Settings → API → anon / publishable key
#   EXPO_TOKEN              expo.dev → Account settings → Access tokens
# Optional, turns on payments (see docs/PAYMENTS.md):
#   STRIPE_SECRET_KEY       Stripe → Developers → API keys → Secret key
#   STRIPE_WEBHOOK_SECRET   Stripe → Developers → Webhooks → your endpoint → Signing secret
# Optional, for live video (see docs/LIVE-VIDEO.md):
#   LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET   LiveKit Cloud → your project → Settings → Keys
# Never loads demo data: the database is marked production on every deploy.
# See docs/DEPLOY.md for the step-by-step.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  supabase:
    name: Database + Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID || 'yscrfhaedexogvegbvzm' }}"
      - name: Apply database migrations
        run: npx supabase db push --include-all
      - name: Production settings (texting demo mode off)
        run: npx supabase secrets set IMIN_ENV=production --project-ref "${{ secrets.SUPABASE_PROJECT_ID || 'yscrfhaedexogvegbvzm' }}"
      - name: Payment keys (only if the Stripe secrets are set)
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          if [ -n "$STRIPE_SECRET_KEY" ] && [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            npx supabase secrets set STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" --project-ref "${{ secrets.SUPABASE_PROJECT_ID || 'yscrfhaedexogvegbvzm' }}"
          else
            echo "Stripe secrets not set: payments stay off."
          fi
      - name: Live video keys (only if the LiveKit secrets are set)
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          if [ -n "$LIVEKIT_URL" ] && [ -n "$LIVEKIT_API_KEY" ] && [ -n "$LIVEKIT_API_SECRET" ]; then
            npx supabase secrets set LIVEKIT_URL="$LIVEKIT_URL" LIVEKIT_API_KEY="$LIVEKIT_API_KEY" LIVEKIT_API_SECRET="$LIVEKIT_API_SECRET" --project-ref "${{ secrets.SUPABASE_PROJECT_ID || 'yscrfhaedexogvegbvzm' }}"
          else
            echo "LiveKit secrets not set: live video stays off."
          fi
      - name: AI key (only if the Anthropic secret is set)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            npx supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "${{ secrets.SUPABASE_PROJECT_ID || 'yscrfhaedexogvegbvzm' }}"
          else
            echo "Anthropic secret not set: AI features show 'coming soon'."
          fi
      - name: Deploy Edge Functions
        run: npx supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_ID || 'yscrfhaedexogvegbvzm' }}"
      - name: Mark database as production (blocks demo data)
        run: node scripts/mark-production.mjs
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'yscrfhaedexogvegbvzm' }}

  app:
    name: Publish app update (Expo) and web version
    needs: supabase
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://yscrfhaedexogvegbvzm.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable__-ErdDTF4PkiFSicYba6PQ_FgE5Zmgn' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publish update to the "production" channel
        run: npx eas-cli@latest update --channel production --message "${{ github.event.head_commit.message || 'Manual deploy' }}" --non-interactive
      # The web version, for testers without Expo Go: https://imin-dc.expo.app
      # (EAS Hosting, free plan). The phone update above goes out first, so a
      # web hiccup never holds it back.
      - name: Build the web version
        run: npx expo export --platform web
      - name: Publish the web version (EAS Hosting)
        run: npx eas-cli@latest deploy --prod --non-interactive --dev-domain imin-dc
